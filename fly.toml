# Trilyt marketing site.
#
# Region matches oneryde-api: Fly retired Mumbai ('bom'), and Singapore is the
# closest region to our riders — there is no Indian option.

app = 'trilyt-web'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm so the landing page never pays a cold start.
  # Drop to 0 to cut cost at the expense of a slow first request.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
